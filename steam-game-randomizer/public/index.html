<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Game Randomizer 🎮</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Can't decide what to play? Let fate choose your next Steam game!">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GameRandom">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Game Randomizer">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container landing">
        <div class="hero">
            <h1>🎮 Game Randomizer</h1>
            <p class="subtitle">Can't decide what to play? Let fate choose!</p>
            
            <div class="login-card">
                <h3>Log in with Steam to get started</h3>
                <p class="help-text">We'll automatically import your game library</p>
                
                <a href="/auth/steam" class="steam-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M11.979 0C5.666 0 .504 5.013 0 11.24l5.237 2.465a3.988 3.988 0 0 1 1.65-.358c.686 0 1.323.175 1.886.484l2.548-4.37a4.017 4.017 0 0 1-.031-.475c0-2.21 1.791-4.001 4.001-4.001 2.21 0 4.001 1.791 4.001 4.001 0 2.21-1.791 4.001-4.001 4.001-.163 0-.324-.011-.482-.033l-2.371 4.598c.307.558.481 1.19.481 1.868 0 .618-.138 1.202-.382 1.728l4.921 2.45C23.823 21.715 24 20.987 24 20.175 24 9.029 14.86 0 11.979 0zm-2.59 18.138c-1.689 0-3.057-1.368-3.057-3.057s1.368-3.057 3.057-3.057 3.057 1.368 3.057 3.057-1.368 3.057-3.057 3.057z"/>
                    </svg>
                    Sign in with Steam
                </a>
                
                <p class="legal-text">
                    Your password never leaves Steam's servers. 
                    We only receive your verified SteamID.
                </p>
            </div>
        </div>
    </div>

    <!-- PWA Installation Script -->
    <script>
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallBanner();
        });

        function showInstallBanner() {
            const banner = document.createElement('div');
            banner.className = 'install-banner';
            banner.innerHTML = `
                <div class="install-content">
                    <span>📲 Install Game Randomizer for quick access!</span>
                    <div class="install-buttons">
                        <button class="install-dismiss" onclick="dismissInstall()">Later</button>
                        <button class="install-accept" onclick="installApp()">Install</button>
                    </div>
                </div>
            `;
            document.body.appendChild(banner);
        }

        function dismissInstall() {
            document.querySelector('.install-banner')?.remove();
        }

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                
                if (choice.outcome === 'accepted') {
                    console.log('User installed the app');
                    dismissInstall();
                }
                
                deferredPrompt = null;
            }
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('/sw.js')
                    .then(registration => {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('SW registration failed:', error);
                    });
            });
        }

        // Detect if running as installed PWA
        if (window.matchMedia('(display-mode: standalone)').matches || 
            window.navigator.standalone === true) {
            document.body.classList.add('pwa-mode');
        }
    </script>
</body>
</html>
